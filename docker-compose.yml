services:

  mongo:
    image: mongo:8.0
    container_name: shipnow-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: shipnow-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/shipnow
      LOG_LEVEL: info
      GITHUB_CALLBACK_URL: http://localhost:8080/api/v1/auth/github/callback
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - shipnow-uploads:/app/uploads/
      - shipnow-logs:/app/logs

volumes:
  mongo-data:
  shipnow-uploads:
  shipnow-logs: